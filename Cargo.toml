[package]
name = "nes_emulator"

version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nes_cli"
path = "src/main.rs"


[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

[profile.release]
debug = true
strip = false
lto = false
codegen-units = 1
panic = "abort"